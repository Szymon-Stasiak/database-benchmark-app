server:
  port: 8080

spring:
  application:
    name: backend
  # Disable Spring Boot auto-configuration for the per-benchmark DB drivers we use directly inside
  # insert strategies. We open per-strategy MongoClient / Neo4j Driver / JedisPool / Mongo Repos
  # ad-hoc against benchmark containers — we never want a global bean trying to connect to
  # localhost:27017 / :7687 / :6379 on startup.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:sqlite:data/benchmark.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
          issuer-uri: https://accounts.google.com

script-creator:
  base-url: http://localhost:8001

app:
  cors:
    # Comma-separated list. Override per environment with APP_CORS_ALLOWED_ORIGINS env var
    # or --app.cors.allowed-origins=... CLI flag (e.g. https://prod.example.com,https://staging.example.com).
    allowed-origins: http://localhost:5173
