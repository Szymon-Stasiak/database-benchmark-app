[project]
name = "dbagnets"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litellm",
    "python-dotenv",
    "pydantic>=2.0",
    "langgraph>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
dbagnets = "dbagnets.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/dbagnets"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "if __name__ == .__main__.",
]
